openapi: 3.0.3
info:
  title: Drive API
  description: |
    A secure file sharing platform that allows users to upload, expose, and manage access to their files.
    
    ## Features
    - User authentication with phone numbers
    - File upload and management
    - Secure file exposure with time limits
    - Access request and approval system
    - IP-based access control and blacklisting
    - Premium phone-based sharing with secure tokens
    
    ## User Types
    - **Free Users**: Can expose one file at a time for maximum 5 minutes
    - **Premium Users**: Can expose multiple files with custom expiration times up to 24 hours, phone-based sharing
    
    ## Authentication
    Most endpoints require Bearer token authentication. Obtain tokens through the login endpoint.
    
  version: 1.0.0
  contact:
    name: Drive API Support
    url: https://expose.tech/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.expose.drive.tech
    description: Production server

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      summary: Register new user
      description: Register a new user with a phone number. Returns a login hash that must be used for authentication.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: Phone number in international format
                  example: "+918043652258"
            examples:
              valid_phone:
                summary: Valid phone number
                value:
                  phone: "+918043652258"
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User registered successfully"
                  user_id:
                    type: integer
                    example: 1
                  login_hash:
                    type: string
                    description: Unique hash required for login
                    example: "abc123def456..."
                  phone:
                    type: string
                    example: "+918043652258"
        '400':
          description: Invalid phone number format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User with this phone number already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: User login
      description: Authenticate user with phone number and login hash obtained during registration.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, login_hash]
              properties:
                phone:
                  type: string
                  description: Phone number used during registration
                  example: "+918043652258"
                login_hash:
                  type: string
                  description: Login hash received during registration
                  example: "abc123def456..."
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT token for API authentication
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  token_type:
                    type: string
                    example: "bearer"
                  user_id:
                    type: integer
                    example: 1
                  user_type:
                    type: string
                    enum: [free, premium]
                    example: "free"
                  login_hash:
                    type: string
                    example: "abc123def456..."
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/upgrade-premium:
    post:
      summary: Upgrade to premium
      description: Upgrade current user to premium (for testing purposes)
      tags: [Authentication]
      responses:
        '200':
          description: Successfully upgraded to premium
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully upgraded to premium"
                  user_type:
                    type: string
                    example: "premium"
                  phone:
                    type: string
                    example: "+918043652258"
        '400':
          description: User is already premium
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # File Management Endpoints
  /files/upload:
    post:
      summary: Upload file
      description: Upload a file to the user's storage. File size and type restrictions apply based on user type.
      tags: [File Management]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          description: Invalid filename or file format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File size exceeds maximum limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /files/list:
    get:
      summary: List user files
      description: Retrieve a paginated list of files uploaded by the authenticated user.
      tags: [File Management]
      parameters:
        - name: limit
          in: query
          description: Maximum number of files to return
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of files to skip
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Files retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileInfo'
                  total:
                    type: integer
                    description: Total number of files
                  limit:
                    type: integer
                  offset:
                    type: integer

  /files/download/{file_id}:
    get:
      summary: Download file
      description: |
        Download a file owned by the authenticated user.
        
        **Note**: This endpoint returns binary content and should not be tested directly in Swagger UI.
        Use a proper HTTP client or browser for file downloads.
      tags: [File Management]
      parameters:
        - name: file_id
          in: path
          required: true
          description: ID of the file to download
          schema:
            type: integer
      responses:
        '200':
          description: File content (binary download)
          content:
            '*/*':
              schema:
                type: string
                format: binary
                description: Binary file content
          headers:
            Content-Disposition:
              description: Attachment with original filename
              schema:
                type: string
                example: 'attachment; filename="document.pdf"'
            Content-Type:
              description: MIME type of the file
              schema:
                type: string
                example: 'application/pdf'
            Content-Length:
              description: File size in bytes
              schema:
                type: integer
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /files/delete:
    delete:
      summary: Delete file
      description: Permanently delete a file from user's storage.
      tags: [File Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id:
                  type: integer
                  description: ID of the file to delete
                  example: 1
      responses:
        '200':
          description: File deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "File deleted successfully"
                  file_id:
                    type: integer
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # File Exposure Endpoints
  /expose/file:
    post:
      summary: Expose file for sharing
      description: |
        Create a public exposure for a file that others can request access to.
        
        **User Type Limitations:**
        - Free users: Maximum 5 minutes exposure, one file at a time
        - Premium users: Up to 24 hours exposure, unlimited files
      tags: [File Exposure]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id, permission]
              properties:
                file_id:
                  type: integer
                  description: ID of the file to expose
                  example: 1
                permission:
                  type: string
                  enum: [read_only, download]
                  description: Access permission level
                  example: "download"
                expires_minutes:
                  type: integer
                  description: |
                    Expiration time in minutes.
                    - Free users: 1-5 minutes (default: 5)
                    - Premium users: 1-1440 minutes (default: no expiry)
                  minimum: 1
                  maximum: 1440
                  example: 30
      responses:
        '200':
          description: File exposed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureResponse'
        '400':
          description: Invalid request or free user limitations exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Free users can only expose one file at a time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /expose/list:
    get:
      summary: List user's exposures
      description: Retrieve all active file exposures created by the authenticated user.
      tags: [File Exposure]
      responses:
        '200':
          description: Exposures retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  exposures:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExposureResponse'
                  total:
                    type: integer

  /expose/info/{exposure_hash}:
    get:
      summary: Get exposure information
      description: Get public information about an exposed file. No authentication required.
      tags: [File Exposure]
      security: []
      parameters:
        - name: exposure_hash
          in: path
          required: true
          description: Hash of the exposed file
          schema:
            type: string
      responses:
        '200':
          description: Exposure information
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_name:
                    type: string
                    example: "document.pdf"
                  file_size:
                    type: integer
                    example: 1048576
                  permission:
                    type: string
                    example: "download"
                  exposure_type:
                    type: string
                    example: "free"
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                    example: "2025-01-22T10:35:00Z"
        '404':
          description: Exposure not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Exposure has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /expose/file/{exposure_hash}:
    delete:
      summary: Stop file exposure
      description: Deactivate an active file exposure, making it no longer accessible.
      tags: [File Exposure]
      parameters:
        - name: exposure_hash
          in: path
          required: true
          description: Hash of the exposure to stop
          schema:
            type: string
      responses:
        '200':
          description: Exposure stopped successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Exposure stopped successfully"
                  exposure_hash:
                    type: string
        '404':
          description: Exposure not found or already stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Access Request Endpoints
  /access/request:
    post:
      summary: Request access to exposed file
      description: |
        Request access to an exposed file. No authentication required.
        The requester's IP address is automatically detected from the request.
        
        **Access Flow:**
        - Premium exposures: Immediate access granted
        - Free exposures: Requires owner approval
      tags: [Access Management]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exposure_hash]
              properties:
                exposure_hash:
                  type: string
                  description: Hash of the exposed file
                  example: "abc123def456..."
            examples:
              valid_request:
                summary: Request access to file
                value:
                  exposure_hash: "c77d2ac3d706bfbf3c133fdeb8399eb415b7f200969a081071762a7bd1690364"
      responses:
        '200':
          description: Access request processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_granted:
                    type: boolean
                    description: Whether immediate access was granted
                  message:
                    type: string
                    example: "Access request sent to file owner for approval"
                  file_name:
                    type: string
                    nullable: true
                    description: File name (only if access granted)
                  file_size:
                    type: integer
                    nullable: true
                    description: File size (only if access granted)
                  permission:
                    type: string
                    nullable: true
                    description: Permission level (only if access granted)
        '404':
          description: Exposure not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: IP address is blacklisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /access/view/{exposure_hash}:
    get:
      summary: View file information
      description: |
        View information about an exposed file. Requires approved access for free exposures.
        No authentication required, but access must be approved.
      tags: [Access Management]
      security: []
      parameters:
        - name: exposure_hash
          in: path
          required: true
          description: Hash of the exposed file
          schema:
            type: string
      responses:
        '200':
          description: File information
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_name:
                    type: string
                    example: "document.pdf"
                  file_size:
                    type: integer
                    example: 1048576
                  mime_type:
                    type: string
                    example: "application/pdf"
                  permission:
                    type: string
                    example: "download"
                  uploaded_at:
                    type: string
                    format: date-time
        '403':
          description: Access not approved or permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Exposure not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /access/download/{exposure_hash}:
    get:
      summary: Download exposed file
      description: |
        Download an exposed file. Requires download permission and approved access for free exposures.
        No authentication required, but access must be approved.
        
        **Note**: This endpoint returns binary content and should not be tested directly in Swagger UI.
        Use a proper HTTP client or browser for file downloads.
      tags: [Access Management]
      security: []
      parameters:
        - name: exposure_hash
          in: path
          required: true
          description: Hash of the exposed file
          schema:
            type: string
      responses:
        '200':
          description: File content (binary download)
          content:
            '*/*':
              schema:
                type: string
                format: binary
                description: Binary file content
          headers:
            Content-Disposition:
              description: Attachment with original filename
              schema:
                type: string
            Content-Type:
              description: MIME type of the file
              schema:
                type: string
            Content-Length:
              description: File size in bytes
              schema:
                type: integer
        '403':
          description: Access not approved or download not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Exposure or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Premium Features Endpoints
  /premium/expose:
    post:
      summary: Create premium exposure
      description: Create file exposure with phone-based sharing for premium users
      tags: [Premium Features]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id, permission, shared_with_phones]
              properties:
                file_id:
                  type: integer
                  description: ID of file to expose
                  example: 1
                permission:
                  type: string
                  enum: [read_only, download]
                  description: Permission level
                  example: "download"
                expires_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  description: Expiration time in minutes (1-1440)
                  example: 720
                shared_with_phones:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Phone numbers to share with
                  example: ["+918043652258", "+919876543210"]
                max_downloads_per_recipient:
                  type: integer
                  minimum: 1
                  description: Maximum downloads per recipient
                  example: 3
      responses:
        '201':
          description: Premium exposure created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiumExposureResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Premium features require premium subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /premium/exposures:
    get:
      summary: List premium exposures
      description: List all premium exposures for current user
      tags: [Premium Features]
      responses:
        '200':
          description: List of premium exposures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PremiumExposureResponse'
        '403':
          description: Premium features require premium subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /premium/share/add:
    post:
      summary: Add recipient to exposure
      description: Add a new recipient to an existing premium exposure
      tags: [Premium Features]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exposure_hash, phone]
              properties:
                exposure_hash:
                  type: string
                  description: Hash of exposure to add recipient to
                  example: "abc123def456..."
                phone:
                  type: string
                  description: Phone number to share with
                  example: "+919999999999"
                max_downloads:
                  type: integer
                  minimum: 1
                  description: Maximum downloads for this recipient
                  example: 2
      responses:
        '201':
          description: Recipient added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiumShareResponse'
        '400':
          description: Invalid phone number format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Premium exposure not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Phone number already has access to this file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /premium/share/revoke:
    post:
      summary: Revoke share access
      description: Revoke access for a specific recipient
      tags: [Premium Features]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [share_id]
              properties:
                share_id:
                  type: integer
                  description: ID of share to revoke
                  example: 1
      responses:
        '200':
          description: Share access revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Share access revoked successfully"
                  share_id:
                    type: integer
                  revoked_phone:
                    type: string
        '404':
          description: Share not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to revoke this share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /premium/access/{access_token}:
    get:
      summary: Access premium file
      description: Access premium shared file with token and phone verification
      tags: [Premium Features]
      security: []
      parameters:
        - name: access_token
          in: path
          required: true
          description: Access token for the shared file
          schema:
            type: string
        - name: phone
          in: query
          required: true
          description: Phone number for verification
          schema:
            type: string
            example: "+918043652258"
      responses:
        '200':
          description: File access information
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_name:
                    type: string
                    example: "document.pdf"
                  file_size:
                    type: integer
                    example: 1048576
                  mime_type:
                    type: string
                    example: "application/pdf"
                  permission:
                    type: string
                    enum: [read_only, download]
                  download_count:
                    type: integer
                    description: Number of downloads used by this recipient
                  max_downloads:
                    type: integer
                    nullable: true
                    description: Maximum downloads allowed for this recipient
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
        '400':
          description: Invalid access token format or phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invalid access token or phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Access token has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /premium/download/{access_token}:
    get:
      summary: Download premium file
      description: |
        Download premium shared file with token and phone verification.
        
        **Note**: This endpoint returns binary content and should not be tested directly in Swagger UI.
        Use a proper HTTP client or browser for file downloads.
      tags: [Premium Features]
      security: []
      parameters:
        - name: access_token
          in: path
          required: true
          description: Access token for the shared file
          schema:
            type: string
        - name: phone
          in: query
          required: true
          description: Phone number for verification
          schema:
            type: string
            example: "+918043652258"
      responses:
        '200':
          description: File download (binary content)
          content:
            '*/*':
              schema:
                type: string
                format: binary
                description: Binary file content
          headers:
            Content-Disposition:
              description: File attachment with original filename
              schema:
                type: string
            Content-Type:
              description: MIME type of the file
              schema:
                type: string
            Content-Length:
              description: File size in bytes
              schema:
                type: integer
        '400':
          description: Invalid access token format or phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Download limit exceeded or download not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invalid access token, phone number, or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Approval Management Endpoints
  /approve/pending:
    get:
      summary: Get pending access requests
      description: Retrieve all pending access requests for files owned by the authenticated user.
      tags: [Approval Management]
      responses:
        '200':
          description: Pending requests retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_requests:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Access request ID
                        exposure_hash:
                          type: string
                        requester_ip:
                          type: string
                        user_agent:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        file_name:
                          type: string
                          description: Name of the requested file
                  total:
                    type: integer

  /approve/decision:
    post:
      summary: Approve or deny access request
      description: Make a decision on a pending access request.
      tags: [Approval Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_id, approved]
              properties:
                access_id:
                  type: integer
                  description: ID of the access request to decide on
                  example: 1
                approved:
                  type: boolean
                  description: Whether to approve or deny the request
                  example: true
      responses:
        '200':
          description: Decision recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Access request approved successfully"
                  access_id:
                    type: integer
                  status:
                    type: string
                    enum: [approved, denied]
        '404':
          description: Access request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /approve/bulk-decision:
    post:
      summary: Bulk approve or deny requests
      description: Approve or deny multiple access requests at once.
      tags: [Approval Management]
      parameters:
        - name: approved
          in: query
          required: true
          description: Whether to approve or deny all requests
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                description: Access request ID
              example: [1, 2, 3]
      responses:
        '200':
          description: Bulk decision processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Bulk decision processed successfully"
                  processed_count:
                    type: integer
                  status:
                    type: string
                    enum: [approved, denied]

  /approve/history:
    get:
      summary: Get access history
      description: Retrieve the history of all access requests for files owned by the authenticated user.
      tags: [Approval Management]
      parameters:
        - name: limit
          in: query
          description: Maximum number of records to return
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of records to skip
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Access history retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        exposure_hash:
                          type: string
                        requester_ip:
                          type: string
                        user_agent:
                          type: string
                          nullable: true
                        status:
                          type: string
                          enum: [pending, approved, denied]
                        created_at:
                          type: string
                          format: date-time
                        accessed_at:
                          type: string
                          format: date-time
                          nullable: true
                        file_name:
                          type: string
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /approve/clear-denied:
    delete:
      summary: Clear denied requests
      description: Remove all denied access requests from the history.
      tags: [Approval Management]
      responses:
        '200':
          description: Denied requests cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Cleared 5 denied access requests"
                  deleted_count:
                    type: integer

  # Utility Endpoints
  /health:
    get:
      summary: Health check
      description: Check if the API is running and healthy.
      tags: [Utility]
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                  service:
                    type: string
                    example: "Drive API"
                  version:
                    type: string
                    example: "1.0.0"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the login endpoint

  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Error message
          example: "File not found"
        code:
          type: string
          description: Error code
      required:
        - detail

    FileInfo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        original_name:
          type: string
          example: "document.pdf"
        file_size:
          type: integer
          description: File size in bytes
          example: 1048576
        mime_type:
          type: string
          example: "application/pdf"
        uploaded_at:
          type: string
          format: date-time
          example: "2025-01-22T10:30:00Z"
        user_id:
          type: integer
          example: 1
        status:
          type: string
          enum: [uploaded, exposed, deleted]
          example: "uploaded"

    ExposureResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        exposure_hash:
          type: string
          description: Unique hash for accessing the exposed file
          example: "abc123def456..."
        file_id:
          type: integer
          example: 1
        file_name:
          type: string
          example: "document.pdf"
        permission:
          type: string
          enum: [read_only, download]
          example: "download"
        exposure_type:
          type: string
          enum: [free, premium]
          example: "free"
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-22T10:35:00Z"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2025-01-22T10:30:00Z"

    PremiumShareResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        exposure_id:
          type: integer
          example: 1
        shared_with_phone:
          type: string
          example: "+918043652258"
        access_token:
          type: string
          description: Secure access token for this recipient
          example: "def789ghi012..."
        status:
          type: string
          enum: [active, expired, revoked]
          example: "active"
        download_count:
          type: integer
          description: Number of downloads used by this recipient
          example: 2
        max_downloads:
          type: integer
          nullable: true
          description: Maximum downloads allowed for this recipient
          example: 5
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-22T22:30:00Z"
        created_at:
          type: string
          format: date-time
          example: "2025-01-22T10:30:00Z"

    PremiumExposureResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        exposure_hash:
          type: string
          description: Unique hash for the exposure
          example: "abc123def456..."
        file_id:
          type: integer
          example: 1
        permission:
          type: string
          enum: [read_only, download]
          example: "download"
        exposure_type:
          type: string
          example: "premium"
        premium_token:
          type: string
          nullable: true
          description: Main premium token for the exposure
          example: "xyz789uvw012..."
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-22T22:30:00Z"
        shared_recipients:
          type: array
          items:
            $ref: '#/components/schemas/PremiumShareResponse'
          description: List of recipients and their access details
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2025-01-22T10:30:00Z"

tags:
  - name: Authentication
    description: User registration and login operations
  - name: File Management
    description: Upload, download, and manage files
  - name: File Exposure
    description: Create and manage file exposures for sharing
  - name: Access Management
    description: Request and manage access to exposed files
  - name: Approval Management
    description: Approve or deny access requests
  - name: Premium Features
    description: Premium user features with phone-based sharing and secure tokens
  - name: Utility
    description: Health checks and system information